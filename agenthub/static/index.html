<!DOCTYPE html>
<html lang="en" data-theme="charcoal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>AgentHub</title>
    <script>
        // Apply the last-used theme before first paint; the server setting confirms it on connect.
        try { var t = localStorage.getItem('agentchattr-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <link rel="stylesheet" id="hljs-theme" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="/static/style.css?v=276">
    <link rel="stylesheet" href="/static/artifacts.css?v=2">
    <link rel="stylesheet" href="/static/control.css?v=5">
    <link rel="stylesheet" href="/static/voice.css?v=3">
    <link rel="stylesheet" href="/static/activity.css?v=3">
    <link rel="stylesheet" href="/static/sessions.css?v=224">
    <link rel="stylesheet" href="/static/jobs.css?v=226">
    <link rel="stylesheet" href="/static/maskpaint.css?v=1">
    <link rel="stylesheet" href="/static/ui.css?v=1">
    <link rel="stylesheet" href="/static/shell.css?v=3">
    <link rel="stylesheet" href="/static/settings.css?v=5">
    <link rel="stylesheet" href="/static/agents.css?v=3">
    <link rel="icon" href="/static/favicon.ico">
</head>
<body>
    <div id="app">
        <div id="drawer-backdrop" onclick="toggleDrawer(null)"></div>
        <header>
            <div class="header-left">
                <button class="mobile-nav-btn" id="nav-channels" type="button" title="Menu" aria-label="Menu" aria-controls="channel-sidebar" aria-expanded="false" onclick="toggleDrawer('channels')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <img src="/static/logo.png" alt="AgentHub" class="header-logo">
                <h1 id="room-title">AgentHub</h1>
                <span class="subtitle" id="room-subtitle"></span>
            </div>
            <div class="header-right">
                <div id="agent-status"></div>
                <!-- Top bar mode on a wide screen: channels.js moves the nav tools in here -->
                <div id="header-tools" role="group" aria-label="Tools"></div>
                <button class="mobile-nav-btn" id="nav-members" type="button" title="Members" aria-label="Members" aria-controls="members-panel" aria-expanded="false" onclick="toggleDrawer('members')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.7-3.6 3.3-5.5 6.5-5.5s5.8 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.4 0 4 1.5 4.5 4"/></svg>
                </button>
            </div>
        </header>

        <!-- Holding pen: settings-modal.js moves these controls into its pages and back (handlers stay attached) -->
        <div id="settings-bar" class="hidden">
            <div class="settings-field" data-group="chat">
                <label for="setting-username">Your name</label>
                <input type="text" id="setting-username" placeholder="your name" maxlength="20">
            </div>
            <div class="settings-field" data-group="chat">
                <label for="setting-subtitle">Server label</label>
                <input type="text" id="setting-subtitle" placeholder="e.g. urbly" maxlength="40" title="Shown next to agentchattr, to tell this server apart from others">
            </div>
            <div class="settings-field" data-group="appearance">
                <label for="setting-theme">Theme</label>
                <select id="setting-theme">
                    <option value="charcoal">Charcoal</option>
                    <option value="graphite">Graphite</option>
                    <option value="slate">Slate</option>
                    <option value="forest">Forest</option>
                    <option value="plum">Plum</option>
                    <option value="midnight">Midnight</option>
                    <option value="contrast">High contrast</option>
                    <option value="light">Light</option>
                    <option value="paper">Paper</option>
                    <option value="mist">Mist</option>
                    </select>
            </div>
            <div class="settings-field" data-group="appearance">
                <label for="setting-font">Font</label>
                <select id="setting-font">
                    <option value="mono">Monospace</option>
                    <option value="sans">Sans</option>
                </select>
            </div>
            <div class="settings-field" data-group="chat">
                <label for="setting-hops">Loop guard</label>
                <input type="number" id="setting-hops" min="0" max="50" value="4" title="Max agent-to-agent hops before pausing (0 = off)">
            </div>
            <div class="settings-field" data-group="chat">
                <label for="setting-untagged">Untagged messages</label>
                <select id="setting-untagged" title="Who answers a message that names nobody with @. Channel agents: everyone in the channel (in #general, nobody). Model picks: the best-suited agent. Random agent: one of them.">
                    <option value="channel">Channel agents</option>
                    <option value="pick">Model picks</option>
                    <option value="random">Random agent</option>
                </select>
            </div>
            <div class="settings-field" data-group="chat">
                <label for="setting-picker">Picking model</label>
                <select id="setting-picker" title="The API agent whose model picks who answers">
                    <option value="">Automatic</option>
                </select>
            </div>
            <div class="settings-field" data-group="chat">
                <label for="setting-name-mentions">Names without @</label>
                <select id="setting-name-mentions" title="A message that contains an agent's name is addressed to that agent">
                    <option value="0">Ignored</option>
                    <option value="1">Address it</option>
                </select>
            </div>
            <div class="settings-field" data-group="chat">
                <label for="setting-history">Messages loaded</label>
                <select id="setting-history">
                    <option value="all">All</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                    <option value="500">500</option>
                </select>
            </div>
            <div class="settings-field" data-group="appearance">
                <label for="setting-contrast">Text contrast</label>
                <select id="setting-contrast">
                    <option value="normal">Normal</option>
                    <option value="high">High</option>
                </select>
            </div>
            <div class="settings-field" data-group="appearance">
                <label for="setting-channel-sidebar">Channel list</label>
                <select id="setting-channel-sidebar" title="Show channels in a sidebar (Discord/Slack-style) instead of a top bar">
                    <option value="top">Top bar</option>
                    <option value="sidebar">Sidebar</option>
                </select>
            </div>
            <div class="settings-field" data-group="chat">
                <label for="setting-rules-refresh">Rule refresh</label>
                <select id="setting-rules-refresh" title="How often to re-send active rules to agents">
                    <option value="0">On rule changes</option>
                    <option value="5">Every 5 triggers</option>
                    <option value="10" selected>Every 10 triggers</option>
                    <option value="20">Every 20 triggers</option>
                    <option value="50">Every 50 triggers</option>
                </select>
            </div>
            <div class="settings-field" data-group="notifications">
                <div id="sound-settings"></div>
            </div>
            <div class="settings-field" data-group="history">
                <label>Room history</label>
                <div class="settings-history-btns">
                    <button type="button" class="ui-btn" onclick="exportHistory()">Export history</button>
                    <button type="button" class="ui-btn" id="import-history-btn" onclick="document.getElementById('import-file').click()">Import history</button>
                    <input type="file" id="import-file" accept=".zip" style="display:none" onchange="importHistory(this)">
                </div>
            </div>
        </div>

        <div id="pins-panel" class="hidden">
            <div class="pins-header">
                <span>Pinned</span>
            </div>
            <div id="pins-list"></div>
        </div>

        <div id="channel-bar">
            <div class="channel-bar-left-spacer" aria-hidden="true"></div>
            <div class="channel-main">
                <div id="channel-tabs"></div>
                <button id="channel-add-btn" class="channel-add" type="button" onclick="showChannelCreateDialog(false)" title="Add channel" aria-label="Add channel"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
            </div>
            <div class="channel-bar-right">
                <a id="update-pill" class="update-pill hidden" href="" target="_blank" rel="noopener"></a>
            </div>
        </div>

        <div id="session-bar" class="hidden">
            <div class="session-info">
                <span class="session-template"></span>
                <span class="session-phase"></span>
                <span class="session-waiting"></span>
            </div>
            <div id="session-end-controls" class="session-end-controls">
                <button id="session-jump-btn" class="session-jump-btn hidden" onclick="jumpToSessionChannel()">Go to channel</button>
                <button id="session-end-btn" class="session-end-btn" onclick="toggleEndSessionConfirm(event)">End Session</button>
            </div>
        </div>

        <div id="content-area">
            <aside id="channel-sidebar" class="hidden" aria-label="Navigation">
                <div id="channel-sidebar-top"></div>
                <section class="nav-group" data-group="channels">
                    <div class="nav-group-head">
                        <button class="nav-group-toggle" type="button" aria-expanded="true" aria-controls="nav-channels-body">
                            <span class="nav-group-title">Channels</span>
                            <span class="ui-badge accent nav-group-unread hidden" id="nav-channels-unread"></span>
                        </button>
                        <button id="channel-sidebar-add" class="nav-icon-btn" type="button" onclick="showChannelCreateDialog(true)" title="Add channel" aria-label="Add channel"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
                    </div>
                    <div class="nav-group-body" id="nav-channels-body">
                        <input type="search" id="channel-filter" class="nav-filter hidden" placeholder="Filter channels" aria-label="Filter channels" autocomplete="off" spellcheck="false">
                        <div id="channel-sidebar-list"></div>
                    </div>
                </section>
                <section class="nav-group" data-group="workspace">
                    <div class="nav-group-head">
                        <button class="nav-group-toggle" type="button" aria-expanded="true" aria-controls="nav-workspace-body">
                            <span class="nav-group-title">Workspace</span>
                        </button>
                    </div>
                    <div class="nav-group-body" id="nav-workspace-body">
                        <div class="nav-tools" id="nav-workspace-tools">
                        <button class="nav-item" id="jobs-toggle" type="button" onclick="toggleJobsPanel()" title="Jobs" aria-label="Jobs" aria-pressed="false">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="2" width="10" height="12" rx="1.5"/><path d="M6 5h4M6 8h4M6 11h2"/></svg>
                            <span class="nav-label">Jobs</span><span class="jobs-badge hidden" id="jobs-badge">0</span>
                        </button>
                        <button class="nav-item" id="rules-toggle" type="button" onclick="toggleRulesPanel()" title="Rules" aria-label="Rules" aria-pressed="false">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5 8l2 2 4-4"/></svg>
                            <span class="nav-label">Rules</span><span class="rules-badge hidden" id="rules-badge">0</span>
                        </button>
                        <button class="nav-item" id="pins-toggle" type="button" onclick="togglePinsPanel()" title="Pinned messages" aria-label="Pinned messages" aria-pressed="false">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5h4l.5 4.5H9.5L8 14 6.5 7H5.5Z"/><path d="M4.5 7h7"/></svg>
                            <span class="nav-label">Pinned messages</span>
                        </button>
                        <button class="nav-item" id="schedules-toggle" type="button" onclick="toggleSchedulesExpand()" title="Scheduled messages" aria-label="Scheduled messages">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 4v4.5l3 1.5"/></svg>
                            <span class="nav-label">Scheduled messages</span>
                        </button>
                        </div>
                    </div>
                </section>
                <div class="nav-bottom" id="nav-bottom">
                    <div class="nav-tools" id="nav-app-tools">
                        <button class="nav-item" id="settings-toggle" type="button" onclick="toggleSettings()" title="Settings" aria-label="Settings">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 1L7.1 3.1C7.4 3.2 7.7 3.4 8 3.6L10 2.8L11.5 5.4L9.8 6.7C9.8 7 9.8 7.3 9.8 7.6L11.5 8.9L10 11.5L8 10.7C7.7 10.9 7.4 11 7.1 11.2L6.5 13.3H3.5L2.9 11.2C2.6 11 2.3 10.9 2 10.7L0 11.5L-1.5 8.9L0.2 7.6C0.2 7.3 0.2 7 0.2 6.7L-1.5 5.4L0 2.8L2 3.6C2.3 3.4 2.6 3.2 2.9 3.1L3.5 1H6.5Z" transform="translate(3 1)"/><circle cx="8" cy="8" r="2"/></svg>
                            <span class="nav-label">Settings</span>
                        </button>
                        <button class="nav-item" id="help-btn" type="button" onclick="toggleHelp()" title="Help" aria-label="Help">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M6.3 6.3a1.8 1.8 0 1 1 2.6 1.6c-.6.3-.9.7-.9 1.3M8 11.4v.1"/></svg>
                            <span class="nav-label">Help</span>
                        </button>
                    </div>
                </div>
                <div class="channel-sidebar-grip" id="channel-sidebar-grip"></div>
            </aside>
            <main id="timeline">
                <div id="day-float" aria-hidden="true"><span></span></div>
                <div id="loading-indicator">
                    <div class="loading-spinner"></div>
                    <span>Loading messages...</span>
                </div>
                <div id="messages"></div>
            </main>
            <aside id="members-panel" aria-label="Members">
                <div class="members-header"><span>Members</span><span class="ui-badge" id="members-count" title="Online">0</span></div>
                <div id="members-list"></div>
            </aside>
            <aside id="jobs-panel" class="hidden">
                <div class="jobs-grip" id="jobs-grip"></div>
                <div id="jobs-list-view">
                    <div class="jobs-header">
                        <span>Jobs</span>
                        <button class="jobs-create-btn" onclick="showCreateJob()" title="Create Job">+</button>
                    </div>
                    <div id="jobs-list"></div>
                </div>
                <div id="jobs-conversation-view" class="hidden">
                    <div class="jobs-conv-header">
                        <button class="jobs-back-btn" onclick="jobsBack()" title="Back">&larr;</button>
                        <span class="jobs-conv-title" id="jobs-conv-title"></span>
                        <div class="jobs-status-toggles" id="jobs-status-toggles">
                            <button class="job-toggle open" data-status="open" onclick="toggleJobStatus('open')" title="To Do">TO DO</button>
                            <button class="job-toggle done" data-status="done" onclick="toggleJobStatus('done')" title="Active">ACTIVE</button>
                            <button class="job-toggle archived" data-status="archived" onclick="toggleJobStatus('archived')" title="Closed">CLOSED</button>
                        </div>
                    </div>
                    <div class="jobs-conv-messages" id="jobs-conv-messages"></div>
                    <div class="jobs-conv-input">
                        <div id="job-mention-menu" class="mention-menu hidden"></div>
                        <div id="job-attachments" class="job-attachments"></div>
                        <div id="job-attachment-status" class="attachment-status" role="status"></div>
                        <div class="job-reply-target-row hidden" id="job-reply-target-row">
                            <button class="job-reply-target-btn" id="job-reply-target-btn" type="button" onclick="cycleJobReplyTarget()" title="Reply target">
                                <span class="job-reply-target-prefix">To</span>
                                <span class="job-reply-target-dot" id="job-reply-target-dot"></span>
                                <span class="job-reply-target-name" id="job-reply-target-name"></span>
                            </button>
                            <button class="job-reply-target-clear hidden" id="job-reply-target-clear" type="button" onclick="clearJobReplyTarget(event)" title="Clear reply target" aria-label="Clear reply target">&times;</button>
                        </div>
                        <div class="job-input-row">
                            <textarea id="jobs-conv-input-text" placeholder="Message..." rows="1"></textarea>
                            <button id="job-send" onclick="sendJobMessage()">Send</button>
                        </div>
                    </div>
                </div>
            </aside>
            <aside id="rules-panel" class="hidden">
                <div class="rules-grip" id="rules-grip"></div>
                <div class="rules-header">
                    <span>Rules</span>
                    <span class="rules-counter" id="rules-counter"></span>
                    <button class="rules-remind-btn" onclick="remindAgents()">Remind agents</button>
                    <button class="jobs-create-btn" onclick="showCreateRule()" title="Add Rule">+</button>
                </div>
                <div id="rules-list"></div>
            </aside>
        </div>

        <div id="scroll-anchor" class="hidden" onclick="scrollToBottom()"><span class="unread-badge">0</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

        <footer>
            <div id="schedules-bar" class="hidden">
                <div class="schedules-bar-summary">
                    <svg class="schedules-icon" width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/>
                        <path d="M8 4v4.5l3 1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="schedules-count" id="schedules-count"></span>
                    <span class="schedules-next" id="schedules-next"></span>
                    <a class="schedules-see-all" onclick="toggleSchedulesExpand()">See all</a>
                </div>
                <div class="schedules-bar-list hidden" id="schedules-list"></div>
            </div>
            <div id="mention-toggles-row">
                <div id="mention-toggles"></div>
                <button id="clear-chat-btn" class="ghost-btn" type="button" onclick="clearChat()" title="Clear chat in this channel">Clear chat</button>
            </div>
            <div id="slash-menu" class="hidden"></div>
            <div id="mention-menu" class="hidden"></div>
            <div id="attachments"></div>
            <div id="attachment-status" class="attachment-status" role="status"></div>
            <div id="input-row">
                <span id="sender-label" class="sender-label">user</span>
                <button id="session-launch-btn" type="button" onclick="showSessionLauncher()" title="Start a session" aria-label="Start a session">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                </button>
                <textarea id="input"
                    placeholder="Type a message... (use @name to mention agents)"
                    rows="1"
                    autofocus></textarea>
                <button id="mic" type="button" onmousedown="event.preventDefault()" onclick="toggleVoice()" title="Voice typing (local speech-to-text)" aria-label="Voice typing" aria-pressed="false">
                    <svg id="mic-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>
                <div class="send-group">
                    <button id="send" type="button" onclick="sendMessage()" title="Send message (Enter)" aria-label="Send message">Send</button>
                    <button id="schedule-btn" class="send-clock" type="button" onclick="toggleSchedulePopover(event)" title="Schedule message" aria-label="Schedule message">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 6v6.5l4 2"/>
                        </svg>
                    </button>
                </div>
                <div id="schedule-popover" class="schedule-popover hidden">
                    <div class="sched-pop-header">
                        <span>Schedule message</span>
                        <button class="sched-pop-close" onclick="closeSchedulePopover()">&times;</button>
                    </div>
                    <div class="sched-pop-body">
                        <div class="sched-pop-row">
                            <label class="sched-pop-label">When</label>
                            <select id="sched-date" class="sched-pop-select" onchange="updateSchedulePopoverState()"></select>
                        </div>
                        <div class="sched-pop-row sched-time-row">
                            <label class="sched-pop-label">At</label>
                            <select id="sched-hour" class="sched-pop-select sched-pop-select-sm" onchange="updateSchedulePopoverState()"></select>
                            <span class="sched-time-colon">:</span>
                            <select id="sched-minute" class="sched-pop-select sched-pop-select-sm" onchange="updateSchedulePopoverState()"></select>
                            <select id="sched-ampm" class="sched-pop-select sched-pop-select-sm" onchange="updateSchedulePopoverState()"></select>
                        </div>
                        <div class="sched-pop-row">
                            <label class="sched-pop-check">
                                <input type="checkbox" id="sched-relative" onchange="toggleRelativeFields()">
                                <span>In a while from now</span>
                            </label>
                        </div>
                        <div class="sched-pop-row sched-relative-fields hidden" id="sched-relative-fields">
                            <label class="sched-pop-label">In</label>
                            <div class="sched-num-wrap">
                                <input type="number" id="sched-rel-h" class="sched-pop-num" value="0" min="0" max="72" onchange="updateSchedulePopoverState()">
                                <div class="sched-num-btns">
                                    <button type="button" onclick="stepNumInput('sched-rel-h',1)" tabindex="-1">&#9650;</button>
                                    <button type="button" onclick="stepNumInput('sched-rel-h',-1)" tabindex="-1">&#9660;</button>
                                </div>
                            </div>
                            <span class="sched-time-colon">h</span>
                            <div class="sched-num-wrap">
                                <input type="number" id="sched-rel-m" class="sched-pop-num" value="30" min="0" max="59" onchange="updateSchedulePopoverState()">
                                <div class="sched-num-btns">
                                    <button type="button" onclick="stepNumInput('sched-rel-m',1)" tabindex="-1">&#9650;</button>
                                    <button type="button" onclick="stepNumInput('sched-rel-m',-1)" tabindex="-1">&#9660;</button>
                                </div>
                            </div>
                            <span class="sched-time-colon">m</span>
                        </div>
                        <div class="sched-pop-row">
                            <label class="sched-pop-check">
                                <input type="checkbox" id="sched-recurring" onchange="toggleRecurringFields()">
                                <span>Recurring</span>
                            </label>
                        </div>
                        <div class="sched-pop-row sched-recurring-fields hidden" id="sched-recurring-fields">
                            <label class="sched-pop-label">Every</label>
                            <div class="sched-num-wrap">
                                <input type="number" id="sched-interval-val" class="sched-pop-num" value="1" min="1" max="99">
                                <div class="sched-num-btns">
                                    <button type="button" onclick="stepSchedNum(1)" tabindex="-1">&#9650;</button>
                                    <button type="button" onclick="stepSchedNum(-1)" tabindex="-1">&#9660;</button>
                                </div>
                            </div>
                            <select id="sched-interval-unit" class="sched-pop-select">
                                <option value="minutes">minutes</option>
                                <option value="hours" selected>hours</option>
                                <option value="days">days</option>
                            </select>
                        </div>
                    </div>
                    <div class="sched-pop-error hidden" id="sched-pop-error"></div>
                    <div class="sched-pop-footer">
                        <button class="sched-pop-cancel" onclick="closeSchedulePopover()">Cancel</button>
                        <button class="sched-pop-submit" onclick="submitSchedulePopover()">Schedule</button>
                    </div>
                </div>
            </div>
            <div class="input-hint">Enter to send &middot; Shift+Enter for a new line &middot; / for commands &middot; @ to mention</div>
        </footer>
    </div>

    <div id="dropzone" class="hidden">
        <div class="dropzone-inner">Drop files here</div>
